name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify no NDK/C++ files (project policy)
        run: |
          if find . -name "CMakeLists.txt" -o -name "*.cpp" -o -name "*.cc" | grep -q .; then
            echo "::error::CMakeLists.txt or C++ sources found. This project is Java/Kotlin-only."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/B.b-key.jks

      - name: Set current date
        run: |
          echo "BUILD_DATE=$(TZ='Asia/Tokyo' date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
          # versionCode用。Intに収める必要があるためUnixエポック秒を使う
          # (BUILD_DATEのYYYYMMDDHHmm形式は12桁でInt上限[約21億]を超えるため使えない)。
          # 2026-08対応: versionCodeが常に固定の1のままだったため、MT Managerの
          # 「インストール前にversionCodeを検証する」設定に引っかかり、APKの中身が
          # 変わっていても実質再インストールされない事故が起きていた。
          echo "BUILD_VERSION_CODE=$(date +'%s')" >> $GITHUB_ENV

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        env:
          KEYSTORE_FILE: B.b-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_VERSION_CODE: ${{ env.BUILD_VERSION_CODE }}
          BUILD_DATE_LABEL: ${{ env.BUILD_DATE }}

      - name: Rename APK file
        run: |
          cd app/build/outputs/apk/debug/
          mv app-debug.apk "app-debug-${{ env.BUILD_DATE }}.apk"

      # -----------------------------------------------------------------
      # Python & ReportLab のセットアップ
      # -----------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install reportlab

      # -----------------------------------------------------------------
      # 1. リポジトリ構造から ZIP ファイルを作成
      # 2. その ZIP を解析して PDF を生成し、ZIP 内に追加 (repo2zip_pdf.py 相当)
      # -----------------------------------------------------------------
      - name: Generate Source ZIP with Embedded PDF Document
        run: |
          python3 - << 'EOF'
          import sys
          import os
          import zipfile
          import tempfile
          from reportlab.lib.pagesizes import letter
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Preformatted, PageBreak
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib import colors

          zip_name = "app-source-${{ env.BUILD_DATE }}.zip"
          pdf_filename = "project_structure_and_code.pdf"

          # 1. リポジトリを ZIP 化 (不要なビルドファイルを除外)
          print(f"[*] Creating ZIP from repository: {zip_name}")
          with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('.'):
                  # .git や build 等の大きすぎるディレクトリを除外
                  dirs[:] = [d for d in dirs if d not in ['.git', '.gradle', 'build', '.idea']]
                  for file in files:
                      if file.endswith(('.zip', '.pdf', '.jks', '.keystore')):
                          continue
                      full_path = os.path.join(root, file)
                      rel_path = os.path.relpath(full_path, '.')
                      z.write(full_path, arcname=rel_path)

          # 2. ZIP 内の構造とソースコードから PDF を生成し、ZIP 内に追記
          print(f"[*] Generating PDF document from ZIP content...")
          with tempfile.TemporaryDirectory() as temp_dir:
              temp_pdf_path = os.path.join(temp_dir, pdf_filename)
              doc = SimpleDocTemplate(temp_pdf_path, pagesize=letter)
              story = []
              styles = getSampleStyleSheet()

              code_style = ParagraphStyle(
                  'CodeStyle',
                  fontName='Courier',
                  fontSize=7,
                  leading=9,
                  textColor=colors.black
              )

              title_style = styles['Title']
              h1_style = styles['Heading1']
              h2_style = styles['Heading2']

              story.append(Paragraph(f"Repository Document: {zip_name}", title_style))
              story.append(Spacer(1, 12))

              with zipfile.ZipFile(zip_name, 'r') as z:
                  story.append(Paragraph("1. Directory Structure", h1_style))
                  tree_text = "\n".join(z.namelist())
                  story.append(Preformatted(tree_text, code_style))
                  story.append(PageBreak())

                  story.append(Paragraph("2. Source Code Contents", h1_style))
                  story.append(Spacer(1, 12))

                  for filename in z.namelist():
                      if filename.endswith('/') or filename == pdf_filename:
                          continue

                      story.append(Paragraph(f"File: {filename}", h2_style))
                      try:
                          content = z.read(filename)
                          text = content.decode('utf-8', errors='replace')
                          if not text.strip():
                              text = "[Empty File]"
                      except Exception as e:
                          text = f"[Read Error / Binary File: {e}]"

                      story.append(Preformatted(text, code_style))
                      story.append(Spacer(1, 14))

              doc.build(story)

              print(f"[*] Appending '{pdf_filename}' into '{zip_name}'...")
              with zipfile.ZipFile(zip_name, 'a') as z:
                  z.write(temp_pdf_path, arcname=pdf_filename)

          print("[+] Process finished successfully!")
          EOF

      # -----------------------------------------------------------------
      # アーティファクトのアップロード（インストール可能なAPK + 内包ZIP）
      # -----------------------------------------------------------------
      - name: Upload APK & Document Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "bb-renderer-debug-${{ env.BUILD_DATE }}"
          path: |
            app/build/outputs/apk/debug/app-debug-${{ env.BUILD_DATE }}.apk
            app-source-${{ env.BUILD_DATE }}.zip
          retention-days: 1
          if-no-files-found: error

