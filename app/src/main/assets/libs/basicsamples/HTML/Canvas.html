<!DOCTYPE html>
<html>
    <body>
        <h3>Canvas Draw Circle</h3>
        <canvas id="myCanvas" width="200" height="100" style="border:1px solid #d3d3d3;"></canvas>
        <h3>Canvas Draw Line</h3>
        <canvas id="myCanvas2" width="200" height="100" style="border:1px solid #d3d3d3;"></canvas>
        <h3>Canvas Draw Text</h3>
        <canvas id="myCanvas3" width="200" height="100" style="border:1px solid #d3d3d3;"></canvas>
        <h3>Canvas Draw Linear Gradient</h3>
        <canvas id="myCanvas4" width="200" height="100" style="border:1px solid #d3d3d3;"></canvas>
        <script>
            var c = document.getElementById("myCanvas");
            var ctx = c.getContext("2d");
            ctx.beginPath();
            ctx.arc(95,50,40,0,2*Math.PI);
            ctx.stroke();
        </script>
        <script>
            var c = document.getElementById("myCanvas2");
            var ctx = c.getContext("2d");
            ctx.moveTo(0,0);
            ctx.lineTo(200,100);
            ctx.stroke();
        </script>
        <script>
            var c = document.getElementById("myCanvas3");
            var ctx = c.getContext("2d");
            ctx.font = "30px Arial";
            ctx.fillText("Hello World",10,50);
        </script>
        <script>
            var c = document.getElementById("myCanvas4");
            var ctx = c.getContext("2d");
            // Create gradient
            var grd = ctx.createLinearGradient(0,0,200,0);
            grd.addColorStop(0,"red");
            grd.addColorStop(1,"white");
            // Fill with gradient
            ctx.fillStyle = grd;
            ctx.fillRect(10,10,150,80);
        </script>
    </body>
</html>
