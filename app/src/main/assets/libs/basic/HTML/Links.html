<!DOCTYPE html>
<html>
    <head>
        <style>
            .link
            {
                color: green;
                background-color: transparent;
                text-decoration: none;
            }
            .link:visited
            {
                color: pink;
                background-color: transparent;
                text-decoration: none;
            }
            .link:hover
            {
                color: red;
                background-color: transparent;
                text-decoration: underline;
            }
            .link:active
            {
                color: yellow;
                background-color: transparent;
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <p><a href="https://www.google.com">Google</a></p>
        <p>You can change the default colors of links</p>
        <a class = "link" href="https://jascriptapp.blogspot.com" target="_blank">Click here to visit JAScript blog</a>
    </body>
</html>
