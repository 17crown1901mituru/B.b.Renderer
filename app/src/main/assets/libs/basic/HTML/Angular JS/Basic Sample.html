<html>
   <head>
      <title>AngularJS First App</title>
   </head>
   
   <body>
      <h1>Sample App</h1>
      
      <div ng-app = "">
         <p>Enter some text: <input type = "text" ng-model = "name"></p>
         <p>Output: <span ng-bind = "name"></span></p>
      </div>
      
      <script src = "https://ajax.googleapis.com/ajax/libs/angularjs/1.3.14/angular.min.js">
      </script>
      
   </body>
</html>
